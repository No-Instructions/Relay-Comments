name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node esbuild.config.mjs production
      - uses: actions/upload-artifact@v4
        with:
          name: relay-comments
          path: |
            main.js
            manifest.json
            styles.css
      # Provenance attestation so installs can be verified against this
      # workflow (gh attestation verify main.js --repo relay-md/relay-comments).
      # Fork PRs cannot mint attestations; only attest our own refs.
      - uses: actions/attest-build-provenance@v2
        if: ${{ github.event_name == 'push' }}
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
